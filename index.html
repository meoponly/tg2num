<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadpool Insider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg: #05080d;
      --card-bg: rgba(10, 16, 26, 0.85);
      --border: #1e293b;
      --accent: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.25);
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.2);
      --danger: #ff3366;
      --warning: #f59e0b;
      --text: #cbd5e1;
      --dim: #64748b;

      /* Terminal width adjusts dynamically to screen size */
      --terminal-w: clamp(320px, 94vw, 580px);
      /* Deadpool's width scales smoothly with the terminal */
      --dp-w: min(calc(var(--terminal-w) * 0.94), 520px);
      /* Proportional height based on the image's aspect ratio (~1200x320 ≈ 0.27) */
      --dp-h: calc(var(--dp-w) * 0.27);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'JetBrains Mono', monospace; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(16px, 3vw, 24px);
      /* Dynamically keeps room at top so Deadpool never gets clipped on any screen */
      padding-top: calc(var(--dp-h) + clamp(20px, 4vh, 40px));
      position: relative;
    }

    body::before {
      content: " ";
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 100;
      pointer-events: none;
      opacity: 0.6;
    }

    .terminal-wrapper {
      position: relative;
      width: var(--terminal-w);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Sitting slightly sunk into the top border for realistic contact, scaled smoothly */
    .deadpool-resting {
      position: absolute;
      width: var(--dp-w);
      /* Moves him lower into the box: offset directly linked to his rendered height */
      top: calc(-1 * var(--dp-h) + clamp(12px, 2.5vw, 22px));
      left: 50%;
      transform: translateX(-50%);
      height: auto;
      pointer-events: none;
      user-select: none;
      z-index: 20;
      filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 16px rgba(0, 240, 255, 0.15));
    }

    .terminal-window {
      background: var(--card-bg);
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      width: 100%;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px var(--cyan-glow);
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 10;
      overflow: hidden;
    }

    .window-header {
      background: #080f1a;
      border-bottom: 1px solid #1e3a5f;
      padding: clamp(10px, 1.8vw, 14px) clamp(14px, 2.4vw, 18px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .window-dots { display: flex; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    .window-title {
      font-size: clamp(0.68rem, 1.8vw, 0.75rem);
      letter-spacing: 2px;
      color: var(--cyan);
      text-transform: uppercase;
      font-weight: 600;
    }

    .window-body {
      padding: clamp(20px, 4vw, 28px) clamp(16px, 3.5vw, 24px);
    }

    .command-prompt {
      font-size: clamp(0.76rem, 2vw, 0.85rem);
      color: var(--dim);
      margin-bottom: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .command-prompt span.accent { color: var(--accent); }

    .usage-badge {
      display: inline-block;
      font-size: clamp(0.68rem, 1.6vw, 0.75rem);
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid #1e3a5f;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 16px;
    }

    .search-bar {
      display: flex;
      gap: 8px;
      background: #040810;
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      padding: 6px 8px;
      transition: all 0.2s ease;
    }

    .search-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .prompt-prefix {
      color: var(--accent);
      display: flex;
      align-items: center;
      padding-left: 6px;
      font-weight: 700;
      user-select: none;
    }

    input[type="text"], input[type="password"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      padding: 8px 4px;
      min-width: 0;
    }

    input[type="text"]::placeholder { color: #334155; }

    button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px clamp(12px, 2.5vw, 18px);
      border-radius: 4px;
      font-weight: 700;
      font-size: clamp(0.75rem, 1.8vw, 0.85rem);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    button:hover {
      background: var(--accent);
      color: #040810;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    button:disabled {
      border-color: #334155;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
      background: transparent;
    }

    .results-area { margin-top: 24px; min-height: 120px; }

    .status-box {
      border-left: 2px solid var(--cyan);
      padding-left: 12px;
      color: var(--dim);
      font-size: clamp(0.78rem, 2vw, 0.85rem);
      line-height: 1.4;
      word-break: break-word;
    }

    .status-box.warning { border-left-color: var(--warning); color: var(--warning); }
    .status-box.error { border-left-color: var(--danger); color: var(--danger); }

    .data-grid { display: grid; gap: 10px; }

    .data-row {
      background: rgba(4, 8, 16, 0.7);
      border: 1px solid #1e293b;
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .data-label {
      color: var(--dim);
      font-size: clamp(0.68rem, 1.6vw, 0.75rem);
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .data-value {
      color: #fff;
      font-size: clamp(0.8rem, 1.8vw, 0.9rem);
      font-weight: 600;
      word-break: break-all;
      text-align: right;
    }

    .highlight-phone {
      color: var(--cyan);
      text-shadow: 0 0 8px var(--cyan-glow);
    }

    .tg-action-wrap { margin-top: 16px; }

    .tg-link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      text-decoration: none;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 11px 16px;
      border-radius: 6px;
      font-size: clamp(0.75rem, 1.8vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .tg-link-btn:hover {
      background: var(--cyan);
      color: #040810;
      box-shadow: 0 0 16px var(--cyan-glow);
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      background: var(--accent);
      vertical-align: middle;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .terminal-footer {
      border-top: 1px solid #1e3a5f;
      background: #080f1a;
      padding: 12px 18px;
      text-align: center;
      font-size: clamp(0.68rem, 1.6vw, 0.75rem);
      color: var(--dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .terminal-footer span {
      color: var(--accent);
      font-weight: 600;
      text-shadow: 0 0 6px var(--accent-glow);
    }

    /* Modal Gate after 3 free tries */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 8, 13, 0.94);
      backdrop-filter: blur(5px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 50;
      text-align: center;
    }

    .modal-card {
      background: #0c1424;
      border: 1px solid var(--danger);
      box-shadow: 0 0 25px rgba(255, 51, 102, 0.25);
      padding: 24px clamp(16px, 3vw, 24px);
      border-radius: 8px;
      width: 100%;
      max-width: 420px;
    }
  </style>
</head>
<body>

  <div class="terminal-wrapper">
    <!-- Lounging Deadpool positioned naturally down against the top bezel -->
    <img src="deadpool.png" alt="Deadpool" class="deadpool-resting" />

    <div class="terminal-window">
      <div class="window-header">
        <div class="window-dots">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
        </div>
        <div class="window-title">SYS_INTEL // V1.0</div>
      </div>

      <div class="window-body">
        <div class="command-prompt">
          <span class="accent">root@recon:~$</span> execute target_probe --protocol=tg<br>
          Target status: Ready for query<span class="cursor"></span>
        </div>

        <div class="usage-badge" id="usageBadge">FREE QUOTA: 3 / 3 REMAINING</div>

        <div class="search-bar">
          <span class="prompt-prefix">></span>
          <input type="text" id="usernameInput" placeholder="handle (e.g. durov)" autocomplete="off" spellcheck="false" />
          <button id="searchBtn" onclick="queryTarget()">Trace</button>
        </div>

        <div class="results-area" id="resultsBox">
          <div class="status-box">Awaiting target input...</div>
        </div>
      </div>

      <!-- 3-Use Quota Modal -->
      <div class="modal-overlay" id="authModal">
        <div class="modal-card">
          <div style="color: var(--danger); font-size: 0.95rem; font-weight: 700; margin-bottom: 8px;">[!] FREE QUOTA EXHAUSTED</div>
          <p style="color: var(--dim); font-size: 0.8rem; margin-bottom: 16px; line-height: 1.4;">
            You have reached your 3 free traces. Enter access key to unlock unlimited terminal traces.
          </p>
          <div class="search-bar" style="margin-bottom: 12px;">
            <input type="password" id="authPassInput" placeholder="Enter password..." />
          </div>
          <button style="width: 100%; border-color: var(--cyan); color: var(--cyan);" onclick="verifyPassword()">UNLOCK SYSTEM</button>
          <div id="modalError" style="color: var(--danger); font-size: 0.75rem; margin-top: 8px; display: none;"></div>
        </div>
      </div>

      <div class="terminal-footer">
        Developed by <span>meoponly</span>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDvyIQNVjXPnVnYQWIcPrr5lrEAKbGr54k",
      authDomain: "ewtube-b3413.firebaseapp.com",
      databaseURL: "https://ewtube-b3413-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ewtube-b3413",
      storageBucket: "ewtube-b3413.firebasestorage.app",
      messagingSenderId: "67454816410",
      appId: "1:67454816410:web:27d326bf9668e5c64fcf23"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let activeApiKey = "DEMOKE";
    let requiredPassword = "";
    const FREE_LIMIT = 3;

    // Synchronize API key and access password live from Firebase
    db.ref("config").on("value", (snapshot) => {
      const conf = snapshot.val();
      if (conf) {
        if (conf.api_key) activeApiKey = conf.api_key;
        if (conf.access_password) requiredPassword = conf.access_password;
      }
    });

    const IGNORED_KEYS = new Set([
      "req_left", "req_total", "developer", "expiry", "msg", "cached", "status", "success"
    ]);

    function getUsageCount() {
      return parseInt(localStorage.getItem("recon_usage_count") || "0", 10);
    }

    function isUnlocked() {
      return localStorage.getItem("recon_unlocked") === "true";
    }

    function updateBadge() {
      const badge = document.getElementById("usageBadge");
      if (isUnlocked()) {
        badge.innerText = "ACCESS LEVEL: UNLIMITED (UNLOCKED)";
        badge.style.color = "var(--accent)";
      } else {
        const left = Math.max(0, FREE_LIMIT - getUsageCount());
        badge.innerText = `FREE QUOTA: ${left} / ${FREE_LIMIT} REMAINING`;
      }
    }
    updateBadge();

    function checkQuota() {
      if (!isUnlocked() && getUsageCount() >= FREE_LIMIT) {
        document.getElementById("authModal").style.display = "flex";
        return false;
      }
      return true;
    }

    function verifyPassword() {
      const pass = document.getElementById("authPassInput").value.trim();
      const errBox = document.getElementById("modalError");

      if (requiredPassword && pass === requiredPassword) {
        localStorage.setItem("recon_unlocked", "true");
        document.getElementById("authModal").style.display = "none";
        updateBadge();
      } else {
        errBox.innerText = "[ERR] Invalid access key.";
        errBox.style.display = "block";
      }
    }

    function validateTelegramUsername(username) {
      if (!username) return { valid: false, error: "Username cannot be empty." };
      if (username.length < 5) return { valid: false, error: "Username too short (minimum 5 chars)." };
      if (username.length > 32) return { valid: false, error: "Username too long (maximum 32 chars)." };
      if (!/^[a-zA-Z][a-zA-Z0-9_]{4,31}$/.test(username)) {
        return { valid: false, error: "Must start with a letter and contain only alphanumeric/underscores." };
      }
      return { valid: true };
    }

    async function logSearchQuery(username) {
      try {
        await db.ref("logs").push({
          target: username,
          timestamp: new Date().toISOString(),
          is_unlocked: isUnlocked(),
          user_agent: navigator.userAgent
        });
      } catch (e) {
        console.warn("Log write omitted:", e);
      }
    }

    async function queryTarget() {
      if (!checkQuota()) return;

      const input = document.getElementById("usernameInput");
      const resultsBox = document.getElementById("resultsBox");
      const searchBtn = document.getElementById("searchBtn");

      let username = input.value.trim();
      if (username.startsWith("@")) username = username.slice(1);

      const validation = validateTelegramUsername(username);
      if (!validation.valid) {
        resultsBox.innerHTML = `<div class="status-box warning">[VALIDATION_ERR] ${validation.error}</div>`;
        return;
      }

      searchBtn.disabled = true;
      searchBtn.innerText = "Scanning...";
      resultsBox.innerHTML = `<div class="status-box">[SCAN] Querying nodes for @${username}...</div>`;

      logSearchQuery(username);

      const targetUrl = `https://owner-jii-apis.vercel.app/tgnum?num=${encodeURIComponent(username)}&api_key=${encodeURIComponent(activeApiKey)}`;

      try {
        const response = await fetch(targetUrl);
        if (!response.ok) throw new Error(`HTTP_${response.status}`);

        const data = await response.json();

        if (!isUnlocked()) {
          const current = getUsageCount() + 1;
          localStorage.setItem("recon_usage_count", current);
          updateBadge();
        }

        renderCleanResults(data, username);
      } catch (err) {
        resultsBox.innerHTML = `<div class="status-box error">[SYS_ERR] ${err.message}</div>`;
      } finally {
        searchBtn.disabled = false;
        searchBtn.innerText = "Trace";
        checkQuota();
      }
    }

    function renderCleanResults(data, username) {
      const resultsBox = document.getElementById("resultsBox");
      const tgButtonHtml = `
        <div class="tg-action-wrap">
          <a href="https://t.me/${encodeURIComponent(username)}" target="_blank" rel="noopener noreferrer" class="tg-link-btn">
            ↗ Open in Telegram (@${username})
          </a>
        </div>
      `;

      const rawString = JSON.stringify(data).toLowerCase();
      if (rawString.includes("not found") || (data.msg && data.msg.toLowerCase().includes("not found"))) {
        resultsBox.innerHTML = `<div class="status-box warning">[!] Phone number not found</div>${tgButtonHtml}`;
        return;
      }

      let payload = data.data || data.result || data;
      const visibleEntries = Object.entries(payload).filter(([k]) => !IGNORED_KEYS.has(k.toLowerCase()));

      if (visibleEntries.length === 0) {
        resultsBox.innerHTML = `<div class="status-box warning">[!] Phone number not found</div>${tgButtonHtml}`;
        return;
      }

      let html = `<div class="data-grid">`;
      for (const [key, value] of visibleEntries) {
        const formattedKey = key.replace(/_/g, " ");
        const isPhone = key.toLowerCase().includes("num") || key.toLowerCase().includes("phone");
        const displayVal = typeof value === "object" ? JSON.stringify(value) : value;

        html += `
          <div class="data-row">
            <span class="data-label">${formattedKey}</span>
            <span class="data-value ${isPhone ? 'highlight-phone' : ''}">${displayVal}</span>
          </div>
        `;
      }
      html += `</div>${tgButtonHtml}`;
      resultsBox.innerHTML = html;
    }

    document.getElementById("usernameInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") queryTarget();
    });
  </script>
</body>
</html>
