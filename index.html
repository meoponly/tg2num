<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG to Phone Converter</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-base: #030712;
            --surface-primary: rgba(17, 24, 39, 0.7);
            --surface-secondary: rgba(31, 41, 55, 0.6);
            --border-primary: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(56, 189, 248, 0.3);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-cyan: #38bdf8;
            --accent-blue: #6366f1;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Backgrounds */
        .ambient-glow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(120px);
            opacity: 0.15;
            transition: all 1s ease;
        }
        .glow-1 {
            top: -100px;
            left: -100px;
            background: radial-gradient(circle, var(--accent-cyan), transparent);
        }
        .glow-2 {
            bottom: -100px;
            right: -100px;
            background: radial-gradient(circle, var(--accent-blue), transparent);
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 10;
        }

        .card {
            background: var(--surface-primary);
            border: 1px solid var(--border-primary);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: all 0.3s ease;
        }

        .header-section {
            text-align: center;
        }

        .header-icon {
            width: 56px;
            height: 56px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        input {
            width: 100%;
            background: var(--surface-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            padding: 14px 14px 14px 42px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .otp-input {
            letter-spacing: 6px;
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            padding-left: 14px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #030712;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
        }

        .error {
            color: var(--accent-red);
        }

        .success {
            color: var(--accent-green);
        }

        /* Result Container */
        #resultView {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .result-box {
            background: var(--surface-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .result-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .result-val {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            user-select: all;
        }
    </style>
</head>
<body>

<div class="ambient-glow glow-1"></div>
<div class="ambient-glow glow-2"></div>

<div class="container">
    <!-- View 1: OTP Auth Check (One-Time Single-Use Verification) -->
    <div class="card" id="otpCard">
        <div class="header-section">
            <div class="header-icon">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1>Single-Use Access</h1>
            <p>Enter your 6-digit one-time pass provided by the administrator.</p>
        </div>

        <div class="input-group">
            <input type="text" id="otpCode" class="otp-input" maxlength="6" placeholder="------" autocomplete="off">
        </div>

        <button class="btn" id="verifyOtpBtn">
            <span>Verify & Proceed</span>
            <i class="fa-solid fa-arrow-right"></i>
        </button>

        <div class="message" id="otpMessage"></div>
    </div>

    <!-- View 2: Converter Main Screen (Appears once OTP is atomically verified) -->
    <div class="card" id="appCard" style="display: none;">
        <div class="header-section">
            <div class="header-icon" style="background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.2); color: var(--accent-blue);">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <h1>Telegram to Phone</h1>
            <p>Resolve Telegram usernames and tags to phone records</p>
        </div>

        <div class="input-group">
            <label>Telegram Username / Tag</label>
            <div class="input-wrapper">
                <i class="fa-brands fa-telegram"></i>
                <input type="text" id="tgInput" placeholder="username without @" autocomplete="off">
            </div>
        </div>

        <button class="btn" id="convertBtn">
            <span>Query Record</span>
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <div class="message" id="appMessage"></div>

        <div id="resultView">
            <div class="result-box">
                <div class="result-label">Resolved Phone Record:</div>
                <div class="result-val" id="phoneOutput">+1 (555) 000-0000</div>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDvyIQNVjXPnVnYQWIcPrr5lrEAKbGr54k",
        authDomain: "ewtube-b3413.firebaseapp.com",
        databaseURL: "https://ewtube-b3413-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "ewtube-b3413",
        storageBucket: "ewtube-b3413.firebasestorage.app",
        messagingSenderId: "67454816410",
        appId: "1:67454816410:web:27d326bf9668e5c64fcf23"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const otpInput = document.getElementById("otpCode");
    const verifyOtpBtn = document.getElementById("verifyOtpBtn");
    const otpMsg = document.getElementById("otpMessage");
    const otpCard = document.getElementById("otpCard");
    const appCard = document.getElementById("appCard");

    // Single-use OTP verification with atomic transaction
    verifyOtpBtn.addEventListener("click", () => {
        const enteredOtp = otpInput.value.trim();

        if (!enteredOtp || enteredOtp.length < 6) {
            otpMsg.className = "message error";
            otpMsg.innerText = "Please enter a valid 6-digit OTP.";
            return;
        }

        verifyOtpBtn.disabled = true;
        otpMsg.className = "message";
        otpMsg.innerText = "Verifying single-use code...";

        const targetOtpRef = db.ref("otps/" + enteredOtp);

        // Atomic transaction: verify existence and purge in one operation
        targetOtpRef.transaction((currentValue) => {
            if (currentValue === null) {
                return; // Does not exist or already expired
            }
            return null; // Atomic deletion marks it consumed immediately
        }, (error, committed, snapshot) => {
            verifyOtpBtn.disabled = false;

            if (error) {
                otpMsg.className = "message error";
                otpMsg.innerText = "Verification error. Check internet connection.";
            } else if (!committed || snapshot.val() === null) {
                otpMsg.className = "message error";
                otpMsg.innerText = "Invalid or already expired OTP.";
            } else {
                otpMsg.className = "message success";
                otpMsg.innerText = "OTP validated! Unlocking...";

                sessionStorage.setItem("otp_session_valid", "true");

                setTimeout(() => {
                    otpCard.style.display = "none";
                    appCard.style.display = "flex";
                }, 600);
            }
        });
    });

    // Converter Logic
    const convertBtn = document.getElementById("convertBtn");
    const tgInput = document.getElementById("tgInput");
    const appMsg = document.getElementById("appMessage");
    const resultView = document.getElementById("resultView");
    const phoneOutput = document.getElementById("phoneOutput");

    convertBtn.addEventListener("click", () => {
        const username = tgInput.value.trim().replace("@", "");

        if (!username) {
            appMsg.className = "message error";
            appMsg.innerText = "Please provide a valid username.";
            return;
        }

        appMsg.className = "message";
        appMsg.innerText = "Querying internal registry...";
        convertBtn.disabled = true;

        setTimeout(() => {
            convertBtn.disabled = false;
            appMsg.className = "";
            appMsg.innerText = "";

            // Simulated lookup resolution demo output
            const simulatedPhone = "+91 9" + Math.floor(100000000 + Math.random() * 900000000);
            phoneOutput.innerText = simulatedPhone;
            resultView.style.display = "flex";

            // Push query log to Firebase
            db.ref("logs").push({
                input: username,
                result: simulatedPhone,
                timestamp: Date.now()
            });
        }, 800);
    });
</script>

</body>
</html>
