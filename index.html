<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG_RESOLVER // TERMINAL</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #030804;
            --term-panel: rgba(5, 18, 9, 0.9);
            --term-border: #00ff66;
            --term-border-dim: rgba(0, 255, 102, 0.3);
            --term-green: #00ff66;
            --term-dim: #00aa44;
            --term-alert: #ff3344;
            --font-mono: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-mono);
        }

        body {
            background-color: var(--bg-color);
            color: var(--term-green);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(rgba(0, 255, 102, 0.08) 1px, transparent 0);
            background-size: 24px 24px;
            text-shadow: 0 0 4px rgba(0, 255, 102, 0.5);
        }

        .terminal-container {
            width: 100%;
            max-width: 460px;
        }

        .terminal-box {
            background: var(--term-panel);
            border: 1px solid var(--term-border);
            border-radius: 4px;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.18), inset 0 0 10px rgba(0, 255, 102, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .term-header {
            background: #021206;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--term-border-dim);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .term-controls span {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .ctrl-close { background: #ff4d4d; }
        .ctrl-min { background: #ffbd2e; }
        .ctrl-max { background: #27c93f; }

        .term-body {
            padding: 26px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .ascii-title {
            font-size: 0.9rem;
            line-height: 1.4;
            color: var(--term-green);
            margin-bottom: 8px;
        }

        .prompt-line {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .input-term {
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--term-border-dim);
            color: var(--term-green);
            padding: 12px 14px;
            font-size: 1.1rem;
            outline: none;
            text-align: center;
            letter-spacing: 4px;
        }

        .input-term:focus {
            border-color: var(--term-border);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        .btn-term {
            background: transparent;
            color: var(--term-green);
            border: 1px solid var(--term-border);
            padding: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            letter-spacing: 2px;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-term:hover {
            background: var(--term-green);
            color: #000;
            box-shadow: 0 0 15px var(--term-green);
        }

        .btn-term:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .terminal-log {
            font-size: 0.85rem;
            min-height: 20px;
        }

        .log-error { color: var(--term-alert); }
        .log-success { color: #22ff88; }

        .result-display {
            display: none;
            border: 1px dashed var(--term-border);
            padding: 14px;
            background: rgba(0, 255, 102, 0.05);
            text-align: center;
            margin-top: 10px;
        }

        .result-text {
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <!-- View 1: One-Time Single-Use OTP Login -->
    <div class="terminal-box" id="authBox">
        <div class="term-header">
            <div class="term-controls">
                <span class="ctrl-close"></span>
                <span class="ctrl-min"></span>
                <span class="ctrl-max"></span>
            </div>
            <div>GATEWAY // ACCESS_GATE</div>
            <div>[SECURE]</div>
        </div>
        <div class="term-body">
            <div class="ascii-title">
                [>] RESTRICTED ACCESS GATEWAY<br>
                [>] ENTER 1-TIME SINGLE USE PASSCODE
            </div>

            <div class="prompt-line">
                <span>OTP#</span>
                <input type="text" id="otpInput" class="input-term" maxlength="6" placeholder="000000" autocomplete="off">
            </div>

            <button class="btn-term" id="verifyOtpBtn">> [EXECUTE_VERIFICATION] <</button>
            <div class="terminal-log" id="authStatus"></div>
        </div>
    </div>

    <!-- View 2: Converter Tool (Unlocks after OTP is consumed) -->
    <div class="terminal-box" id="mainToolBox" style="display: none;">
        <div class="term-header">
            <div class="term-controls">
                <span class="ctrl-close"></span>
                <span class="ctrl-min"></span>
                <span class="ctrl-max"></span>
            </div>
            <div>MODULE // TG2PHONE_RESOLVER</div>
            <div>[UNLOCKED]</div>
        </div>
        <div class="term-body">
            <div class="ascii-title">
                [+] SESSION AUTHENTICATED (TOKEN CONSUMED)<br>
                [+] READY FOR TG QUERY
            </div>

            <div class="prompt-line">
                <span>@</span>
                <input type="text" id="tgQuery" class="input-term" style="text-align: left; letter-spacing: 1px;" placeholder="username" autocomplete="off">
            </div>

            <button class="btn-term" id="queryBtn">> [QUERY_DATABASE] <</button>
            <div class="terminal-log" id="toolStatus"></div>

            <div class="result-display" id="resultBlock">
                <div style="font-size: 0.75rem; color: var(--term-dim);">RESOLVED TELEPHONE:</div>
                <div class="result-text" id="phoneOutput">+1 (555) 000-0000</div>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDvyIQNVjXPnVnYQWIcPrr5lrEAKbGr54k",
        authDomain: "ewtube-b3413.firebaseapp.com",
        databaseURL: "https://ewtube-b3413-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "ewtube-b3413",
        storageBucket: "ewtube-b3413.firebasestorage.app",
        messagingSenderId: "67454816410",
        appId: "1:67454816410:web:27d326bf9668e5c64fcf23"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const otpInput = document.getElementById("otpInput");
    const verifyOtpBtn = document.getElementById("verifyOtpBtn");
    const authStatus = document.getElementById("authStatus");
    const authBox = document.getElementById("authBox");
    const mainToolBox = document.getElementById("mainToolBox");

    // Atomic OTP verification and consumption
    verifyOtpBtn.addEventListener("click", () => {
        const otp = otpInput.value.trim();

        if (!otp || otp.length < 6) {
            authStatus.className = "terminal-log log-error";
            authStatus.innerText = "[!] ERR: 6-digit OTP code required.";
            return;
        }

        verifyOtpBtn.disabled = true;
        authStatus.className = "terminal-log";
        authStatus.innerText = "[*] Verifying & consuming token...";

        const otpRef = db.ref("otps/" + otp);

        otpRef.transaction((data) => {
            if (data === null) {
                return; // Not found or already burned
            }
            return null; // Atomic deletion marks it burned immediately
        }, (error, committed, snapshot) => {
            verifyOtpBtn.disabled = false;

            if (error) {
                authStatus.className = "terminal-log log-error";
                authStatus.innerText = "[!] Network error during transaction.";
            } else if (!committed || snapshot.val() === null) {
                authStatus.className = "terminal-log log-error";
                authStatus.innerText = "[!] ACCESS DENIED: Invalid or expired OTP.";
            } else {
                authStatus.className = "terminal-log log-success";
                authStatus.innerText = "[+] ACCESS GRANTED. Disposing OTP token...";

                setTimeout(() => {
                    authBox.style.display = "none";
                    mainToolBox.style.display = "flex";
                }, 500);
            }
        });
    });

    // Lookup handler
    const queryBtn = document.getElementById("queryBtn");
    const tgQuery = document.getElementById("tgQuery");
    const toolStatus = document.getElementById("toolStatus");
    const resultBlock = document.getElementById("resultBlock");
    const phoneOutput = document.getElementById("phoneOutput");

    queryBtn.addEventListener("click", () => {
        const username = tgQuery.value.trim().replace("@", "");

        if (!username) {
            toolStatus.className = "terminal-log log-error";
            toolStatus.innerText = "[!] Target username required.";
            return;
        }

        toolStatus.className = "terminal-log";
        toolStatus.innerText = "[*] Querying network index...";
        queryBtn.disabled = true;

        setTimeout(() => {
            queryBtn.disabled = false;
            toolStatus.className = "";
            toolStatus.innerText = "";

            const generatedRecord = "+91 9" + Math.floor(100000000 + Math.random() * 900000000);
            phoneOutput.innerText = generatedRecord;
            resultBlock.style.display = "block";

            db.ref("logs").push({
                input: username,
                result: generatedRecord,
                timestamp: Date.now()
            });
        }, 700);
    });
</script>

</body>
</html>
