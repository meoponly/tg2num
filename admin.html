<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG to Phone - Admin Panel</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-base: #030712;
            --surface-primary: rgba(17, 24, 39, 0.7);
            --surface-secondary: rgba(31, 41, 55, 0.6);
            --border-primary: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(56, 189, 248, 0.3);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-cyan: #38bdf8;
            --accent-blue: #6366f1;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Backgrounds */
        .ambient-glow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(120px);
            opacity: 0.15;
            transition: all 1s ease;
        }
        .glow-1 {
            top: -100px;
            left: -100px;
            background: radial-gradient(circle, var(--accent-cyan), transparent);
        }
        .glow-2 {
            bottom: -100px;
            right: -100px;
            background: radial-gradient(circle, var(--accent-blue), transparent);
        }

        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Header / Brand */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: var(--surface-primary);
            border: 1px solid var(--border-primary);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .brand-title i {
            color: var(--accent-cyan);
            font-size: 1.4rem;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .badge-status::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* Card Section */
        .card {
            background: var(--surface-primary);
            border: 1px solid var(--border-primary);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-primary);
            padding-bottom: 14px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #030712;
            font-weight: 700;
        }

        .btn-primary:hover {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-danger:hover {
            background: var(--accent-red);
            color: white;
        }

        /* OTP List styling */
        .otp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
            margin-top: 5px;
        }

        .otp-pill {
            background: var(--surface-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .otp-pill:hover {
            border-color: var(--border-glow);
        }

        .otp-code {
            font-family: monospace;
            font-size: 1.25rem;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .otp-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .empty-placeholder {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-size: 0.9rem;
        }

        /* Table styling for records */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            text-align: left;
        }

        th {
            background: var(--surface-secondary);
            color: var(--text-secondary);
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-primary);
            white-space: nowrap;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-primary);
            color: var(--text-primary);
            white-space: nowrap;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body>

<div class="ambient-glow glow-1"></div>
<div class="ambient-glow glow-2"></div>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="brand-title">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Admin Console</span>
        </div>
        <div class="badge-status">
            Connected to DB
        </div>
    </div>

    <!-- OTP Control Section -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <i class="fa-solid fa-key" style="color: var(--accent-cyan);"></i>
                <span>One-Time Password (OTP) Generation</span>
            </div>
            <button class="btn btn-primary" id="generateOtpBtn">
                <i class="fa-solid fa-plus"></i>
                Generate Single-Use OTP
            </button>
        </div>
        <div id="otpContainer" class="otp-grid">
            <div class="empty-placeholder">Loading active OTPs...</div>
        </div>
    </div>

    <!-- Recent Lookups / Activity Logs -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <i class="fa-solid fa-list-check" style="color: var(--accent-blue);"></i>
                <span>Recent System Lookups</span>
            </div>
        </div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Telegram Input</th>
                        <th>Result Number</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody">
                    <tr>
                        <td colspan="4" class="empty-placeholder">No logs available</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDvyIQNVjXPnVnYQWIcPrr5lrEAKbGr54k",
        authDomain: "ewtube-b3413.firebaseapp.com",
        databaseURL: "https://ewtube-b3413-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "ewtube-b3413",
        storageBucket: "ewtube-b3413.firebasestorage.app",
        messagingSenderId: "67454816410",
        appId: "1:67454816410:web:27d326bf9668e5c64fcf23"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const otpsRef = db.ref("otps");
    const logsRef = db.ref("logs");

    // Generate Single-Use OTP
    document.getElementById("generateOtpBtn").addEventListener("click", () => {
        const otp = Math.floor(100000 + Math.random() * 900000).toString();
        otpsRef.child(otp).set({
            createdAt: Date.now(),
            used: false
        });
    });

    // Realtime Sync for OTPs
    otpsRef.on("value", (snapshot) => {
        const container = document.getElementById("otpContainer");
        container.innerHTML = "";
        const data = snapshot.val();

        if (!data || Object.keys(data).length === 0) {
            container.innerHTML = "<div class='empty-placeholder' style='grid-column: 1/-1;'>No active OTPs. Click generate above.</div>";
            return;
        }

        Object.keys(data).forEach((otp) => {
            const item = data[otp];
            const dateStr = item && item.createdAt ? new Date(item.createdAt).toLocaleTimeString() : "Just now";

            const pill = document.createElement("div");
            pill.className = "otp-pill";
            pill.innerHTML = `
                <div>
                    <div class="otp-code">${otp}</div>
                    <div class="otp-meta">Generated: ${dateStr}</div>
                </div>
                <button class="btn btn-danger" onclick="revokeOtp('${otp}')">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            container.appendChild(pill);
        });
    });

    window.revokeOtp = function(otp) {
        otpsRef.child(otp).remove();
    };

    // Realtime Sync for System Logs
    logsRef.limitToLast(10).on("value", (snapshot) => {
        const tbody = document.getElementById("logsTableBody");
        tbody.innerHTML = "";
        const data = snapshot.val();

        if (!data) {
            tbody.innerHTML = "<tr><td colspan='4' class='empty-placeholder'>No lookup logs recorded yet</td></tr>";
            return;
        }

        const entries = Object.values(data).reverse();
        entries.forEach((log) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${log.timestamp ? new Date(log.timestamp).toLocaleTimeString() : "-"}</td>
                <td><span class="tag">@${log.input || "-"}</span></td>
                <td><code>${log.result || "-"}</code></td>
                <td><span style="color: var(--accent-green);">Success</span></td>
            `;
            tbody.appendChild(tr);
        });
    });
</script>

</body>
</html>
