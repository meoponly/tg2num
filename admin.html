<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL // ADMIN_CONSOLE</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #030804;
            --term-panel: rgba(5, 18, 9, 0.85);
            --term-border: #00ff66;
            --term-border-dim: rgba(0, 255, 102, 0.25);
            --term-green: #00ff66;
            --term-dim: #00aa44;
            --term-alert: #ff3344;
            --font-mono: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-mono);
        }

        body {
            background-color: var(--bg-color);
            color: var(--term-green);
            min-height: 100vh;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            background-image: radial-gradient(rgba(0, 255, 102, 0.08) 1px, transparent 0);
            background-size: 24px 24px;
            text-shadow: 0 0 4px rgba(0, 255, 102, 0.5);
        }

        .terminal-wrapper {
            width: 100%;
            max-width: 880px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .terminal-box {
            background: var(--term-panel);
            border: 1px solid var(--term-border);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15), inset 0 0 10px rgba(0, 255, 102, 0.05);
            overflow: hidden;
        }

        .term-header {
            background: #021206;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--term-border-dim);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .term-controls span {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .ctrl-close { background: #ff4d4d; }
        .ctrl-min { background: #ffbd2e; }
        .ctrl-max { background: #27c93f; }

        .term-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-terminal {
            background: transparent;
            color: var(--term-green);
            border: 1px solid var(--term-border);
            padding: 10px 18px;
            font-size: 0.9rem;
            cursor: pointer;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-terminal:hover {
            background: var(--term-green);
            color: #000;
            box-shadow: 0 0 15px var(--term-green);
        }

        .otp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .otp-item {
            border: 1px dashed var(--term-border-dim);
            padding: 10px 14px;
            background: rgba(0, 255, 102, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .otp-value {
            font-size: 1.2rem;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .btn-revoke {
            background: transparent;
            color: var(--term-alert);
            border: 1px solid var(--term-alert);
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .btn-revoke:hover {
            background: var(--term-alert);
            color: #000;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        th, td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--term-border-dim);
        }

        th {
            color: var(--term-dim);
        }
    </style>
</head>
<body>

<div class="terminal-wrapper">
    <div class="terminal-box">
        <div class="term-header">
            <div class="term-controls">
                <span class="ctrl-close"></span>
                <span class="ctrl-min"></span>
                <span class="ctrl-max"></span>
            </div>
            <div>root@tg2num:~# admin_auth</div>
            <div>[STATUS: ONLINE]</div>
        </div>

        <div class="term-body">
            <div>[+] OTP GENERATION SUBSYSTEM</div>
            <div>
                <button class="btn-terminal" id="generateOtpBtn">
                    <i class="fa-solid fa-terminal"></i> [GENERATE_SINGLE_USE_OTP]
                </button>
            </div>

            <div style="margin-top: 15px; font-size: 0.85rem; color: var(--term-dim);">
                >> ACTIVE UNEXPIRED ONE-TIME TOKENS:
            </div>
            <div id="otpContainer" class="otp-grid">
                <div>Scanning database...</div>
            </div>
        </div>
    </div>

    <div class="terminal-box">
        <div class="term-header">
            <div>root@tg2num:~# lookup_audit_logs</div>
        </div>
        <div class="term-body" style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>TIMESTAMP</th>
                        <th>TARGET_USER</th>
                        <th>RESOLVED_NUMBER</th>
                        <th>RESULT</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody">
                    <tr><td colspan="4">No system logs available.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDvyIQNVjXPnVnYQWIcPrr5lrEAKbGr54k",
        authDomain: "ewtube-b3413.firebaseapp.com",
        databaseURL: "https://ewtube-b3413-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "ewtube-b3413",
        storageBucket: "ewtube-b3413.firebasestorage.app",
        messagingSenderId: "67454816410",
        appId: "1:67454816410:web:27d326bf9668e5c64fcf23"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const otpsRef = db.ref("otps");
    const logsRef = db.ref("logs");

    document.getElementById("generateOtpBtn").addEventListener("click", () => {
        const otp = Math.floor(100000 + Math.random() * 900000).toString();
        otpsRef.child(otp).set({
            createdAt: Date.now(),
            used: false
        });
    });

    otpsRef.on("value", (snapshot) => {
        const container = document.getElementById("otpContainer");
        container.innerHTML = "";
        const data = snapshot.val();

        if (!data || Object.keys(data).length === 0) {
            container.innerHTML = "<div style='color: var(--term-dim);'>[!] No active OTPs stored.</div>";
            return;
        }

        Object.keys(data).forEach((otp) => {
            const item = data[otp];
            const timeStr = item && item.createdAt ? new Date(item.createdAt).toLocaleTimeString() : "--";

            const div = document.createElement("div");
            div.className = "otp-item";
            div.innerHTML = `
                <div>
                    <div class="otp-value">${otp}</div>
                    <div style="font-size: 0.7rem; color: var(--term-dim);">${timeStr}</div>
                </div>
                <button class="btn-revoke" onclick="revokeOtp('${otp}')">[DEL]</button>
            `;
            container.appendChild(div);
        });
    });

    window.revokeOtp = function(otp) {
        otpsRef.child(otp).remove();
    };

    logsRef.limitToLast(10).on("value", (snapshot) => {
        const tbody = document.getElementById("logsTableBody");
        tbody.innerHTML = "";
        const data = snapshot.val();

        if (!data) {
            tbody.innerHTML = "<tr><td colspan='4'>[!] No activity logs found.</td></tr>";
            return;
        }

        Object.values(data).reverse().forEach((log) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${log.timestamp ? new Date(log.timestamp).toLocaleTimeString() : "--"}</td>
                <td>@${log.input || "-"}</td>
                <td>${log.result || "-"}</td>
                <td>[SUCCESS]</td>
            `;
            tbody.appendChild(tr);
        });
    });
</script>

</body>
</html>
