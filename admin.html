<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - OTP Generator</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 420px;
            width: 100%;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 1.4rem;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #3b82f6;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        .active-otps {
            margin-top: 25px;
        }
        .active-otps h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #94a3b8;
        }
        ul {
            list-style: none;
        }
        li {
            background-color: #334155;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        .del-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
            letter-spacing: normal;
            width: auto;
        }
        .del-btn:hover {
            background-color: #dc2626;
        }
    </style>
    <!-- Firebase App & Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="card">
    <h2>OTP Management Console</h2>
    <button id="generateBtn">Generate New 6-Digit OTP</button>

    <div class="active-otps">
        <h3>Active Unused OTPs</h3>
        <ul id="otpList"></ul>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDvyIQNVjXPnVnYQWIcPrr5lrEAKbGr54k",
        authDomain: "ewtube-b3413.firebaseapp.com",
        databaseURL: "https://ewtube-b3413-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "ewtube-b3413",
        storageBucket: "ewtube-b3413.firebasestorage.app",
        messagingSenderId: "67454816410",
        appId: "1:67454816410:web:27d326bf9668e5c64fcf23"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const otpsRef = db.ref("otps");

    document.getElementById("generateBtn").addEventListener("click", () => {
        const otp = Math.floor(100000 + Math.random() * 900000).toString();
        otpsRef.child(otp).set({
            createdAt: Date.now(),
            used: false
        });
    });

    otpsRef.on("value", (snapshot) => {
        const list = document.getElementById("otpList");
        list.innerHTML = "";
        const data = snapshot.val();

        if (!data) {
            list.innerHTML = "<li style='color:#64748b; font-family:inherit; letter-spacing:0;'>No active OTPs</li>";
            return;
        }

        Object.keys(data).forEach((otp) => {
            const li = document.createElement("li");
            li.innerHTML = `
                <span>${otp}</span>
                <button class="del-btn" onclick="deleteOtp('${otp}')">Revoke</button>
            `;
            list.appendChild(li);
        });
    });

    window.deleteOtp = function(otp) {
        otpsRef.child(otp).remove();
    };
</script>

</body>
</html>
